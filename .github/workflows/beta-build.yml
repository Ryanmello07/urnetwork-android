name: Beta Build — Android

on:
  push:
    branches:
      - beta/custom-server
  pull_request:
    branches:
      - beta/custom-server
  workflow_dispatch:

permissions:
  contents: write

env:
  WARP_VERSION: beta-${{ github.run_number }}

jobs:
  build-android:
    name: Build Android app (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [github, play, ethos_dapp, solana_dapp]
    steps:
      - name: Check out Android repo
        uses: actions/checkout@v4

      - name: Check out forked SDK
        uses: actions/checkout@v4
        with:
          repository: Ryanmello07/urnetwork-sdk
          ref: beta/custom-server
          path: urnetwork-sdk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # `id` matters: the SDK build step below reads this action's ndk-path
      # OUTPUT. It used to pass `ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}`,
      # which is self-referential -- it resolves against the workflow/job env
      # map, where nothing defines it, so it set the variable to the empty
      # string and overrode anything the action had exported.
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
          link-to-sdk: true

      # NOT `go-version: stable`. Stable is go 1.27, which REMOVED the
      # `gotypesalias` GODEBUG, and sdk/build/Makefile exports
      # `GODEBUG=gotypesalias=0` in both the build_android and build_apple
      # recipes (it says so itself: "gomobile/gobind must be built with go <=
      # 1.26 -- the go 1.27 runtime fatals when this GODEBUG is set"). Under
      # 1.27 the bind dies with `fatal error: removed GODEBUG "gotypesalias"
      # set to old value "0"`. urnetwork-sdk/build/go.mod pins 1.26.5; read the
      # version from it so this tracks the sdk rather than drifting again.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: urnetwork-sdk/build/go.mod
          cache-dependency-path: urnetwork-sdk/build/go.sum

      - name: Check out connect dependency
        run: git clone --depth 1 --branch beta/custom-server https://github.com/Ryanmello07/connect.git connect

      - name: Check out glog dependency
        run: git clone --depth 1 https://github.com/urnetwork/glog.git glog

      # the sdk's go.mod resolves this with `replace ... => ../goidenticons`,
      # so it has to sit next to urnetwork-sdk like connect and glog do
      - name: Check out goidenticons dependency
        run: git clone --depth 1 https://github.com/urnetwork/goidenticons.git goidenticons

      - name: Build SDK for Android
        working-directory: urnetwork-sdk/build
        env:
          BRINGYOUR_HOME: ${{ github.workspace }}/urnetwork-sdk
          WARP_HOME: ${{ github.workspace }}/urnetwork-sdk
          WARP_VERSION_HOME: ${{ github.workspace }}/urnetwork-sdk/version
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          # setup-go pins 1.26.5 from build/go.mod, but a `go` directive
          # anywhere in the graph could still make the toolchain silently
          # self-upgrade to 1.27 and re-break the bind. `local` turns that into
          # a loud "requires go >= ..." error instead. Every module in the graph
          # is <= 1.26.5 today (sdk, sdk/build, connect, glog, goidenticons).
          GOTOOLCHAIN: local
        run: |
          export PATH="$PATH:/usr/local/go/bin:$HOME/go/bin"
          # build_android resolves llvm-objcopy under ANDROID_NDK_HOME and
          # `test -n`s it under `set -e`. Empty, that fails ~90s into the
          # recipe as an opaque `find: '': No such file or directory`. Say so
          # here instead.
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::ANDROID_NDK_HOME is not a directory (got '$ANDROID_NDK_HOME') -- the setup-ndk step did not produce an ndk-path"
            exit 1
          fi
          make init build_android
          # the sdk's build_android recipe keeps going after a failed
          # `gomobile bind`, so make can exit 0 having produced no aar. that
          # only surfaces later as "Unresolved reference 'sdk'" across every
          # kotlin file, which buries the real go compile error. fail here
          # instead, while it is still on screen.
          aar_dir="$BRINGYOUR_HOME/build/android"
          if ! ls "$aar_dir"/*.aar >/dev/null 2>&1; then
            echo "::error::gomobile bind produced no .aar in $aar_dir -- see the go compile errors above"
            exit 1
          fi

      - name: Write local.properties to bypass warpctl
        working-directory: app
        run: |
          cat > local.properties <<EOF
          warp.version=${{ env.WARP_VERSION }}
          warp.version_code=${{ github.run_number }}
          EOF

      - name: Build ${{ matrix.flavor }}Debug APK
        working-directory: app
        env:
          BRINGYOUR_HOME: ${{ github.workspace }}/urnetwork-sdk
        run: |
          flavor="${{ matrix.flavor }}"
          # Gradle's generated task name only capitalizes the flavor's first
          # letter -- it does not camelCase underscore segments, so
          # ethos_dapp -> assembleEthos_dappDebug, not assembleEthosDappDebug.
          capitalizedFlavor=$(echo "$flavor" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew ":app:assemble${capitalizedFlavor}Debug"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: urnetwork-android-${{ matrix.flavor }}-apk
          path: app/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error

      - name: Create prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: beta-custom-server-${{ matrix.flavor }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "URnetwork Android beta custom server (${{ matrix.flavor }}) ${{ github.run_number }}" \
            --generate-notes \
            app/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
