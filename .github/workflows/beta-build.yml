name: Beta Build — Android

# The copy of this workflow on beta/talisman-live-test. It differs from the copy on
# beta/custom-server in what it builds against, not in how:
#   - the SDK is one commit of Ryanmello07/urnetwork-sdk (branch beta/talisman-live-test:
#     urnetwork/sdk main + the Bittensor wallet-app work), not the fork's beta/custom-server;
#   - connect, glog, goidenticons and gvisor are upstream commits, each pinned by id;
#   - Go and the NDK are the pair upstream's own Android build used (go 1.27.1, ndk 29.0.14206865);
#   - local.properties carries the WalletConnect project id;
#   - a push to this branch, and a manual run, publish a prerelease named beta-talisman-*.
# Keep this file's PATH: github.run_number is counted per workflow file and is the app's
# version code, so a renamed file would restart at 1 and the APK would no longer install
# over the previous beta.

on:
  push:
    branches:
      - beta/talisman-live-test
  pull_request:
    branches:
      - beta/custom-server
      - beta/talisman-live-test
  workflow_dispatch:

permissions:
  contents: write

# one run per branch: a newer push replaces a run that is still building
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WARP_VERSION: beta-${{ github.run_number }}
  # THE PINS. A branch tip moves, a commit does not. Change them together and on purpose.
  # Rule for the pair: an sdk at or after c0b71e29 needs connect at or after 219d2f9e, and
  # before urnetwork/connect#219 (which removes packages this sdk imports).
  SDK_REPOSITORY: Ryanmello07/urnetwork-sdk
  SDK_REF: f24ede22191be9006bc0be4e816237417e93cd4c # beta/talisman-live-test in the sdk fork: upstream ed9f56a5 + the wallet work with the Talisman changes and the device-test layer
  CONNECT_SHA: 97abb1e6ddb5b21403954a556ddc73947993297a # urnetwork/connect main, 2026-10-09
  GLOG_SHA: fe810311aa908259ff133ce502bbf0618dd46a0c # urnetwork/glog master
  GOIDENTICONS_SHA: e94d63579c6b9031d8e110d75cb1f0a9d15ea30a # urnetwork/goidenticons main
  GVISOR_SHA: c0783dba2eeff7b79692a7f122ffee5f8bd837c1 # urnetwork/gvisor go
  # app/app/build.gradle pins ndkVersion '29.0.14206865'
  UR_ANDROID_NDK: "29.0.14206865"
  # A WalletConnect project id is a public client identifier. This is the one the Apple
  # app commits (URWalletConnectProjectId); the relay accepts packageName
  # com.bringyour.network for it.
  WALLETCONNECT_PROJECT_ID: 13470f178edb2a9098d2261d03245975

jobs:
  build-android:
    name: Build Android app (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # the full set. While compile errors are being fixed, [play] alone is quicker.
        flavor: [github, play, ethos_dapp, solana_dapp]
    steps:
      - name: Check the SDK pin
        run: |
          if ! echo "$SDK_REF" | grep -Eq '^[0-9a-f]{40}$' || [ "$SDK_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::SDK_REF is '$SDK_REF': set it to the full commit id of beta/talisman-live-test in $SDK_REPOSITORY"
            exit 1
          fi

      - name: Check out Android repo
        uses: actions/checkout@v4

      - name: Check out the SDK (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPOSITORY }}
          ref: ${{ env.SDK_REF }}
          path: urnetwork-sdk

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f app/debug.keystore ]; then
            cp app/debug.keystore "$HOME/.android/debug.keystore"
          else
            echo "::error::app/debug.keystore is missing: the APK would be signed with a new key and would not install over the previous beta"
            exit 1
          fi

      # v3 defaults its `packages` input to `tools platform-tools`, and Google
      # has since removed the retired `tools` package from the SDK repository,
      # so sdkmanager exits 1 before anything builds. v4 drops it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The SDK build finds llvm-objcopy under ANDROID_NDK_HOME, and AGP strips the
      # .aar's native libraries with the NDK that build.gradle names. One NDK for
      # both, installed the way upstream's own workflow installed it.
      - name: Install the pinned Android NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | timeout 300 "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "ndk;$UR_ANDROID_NDK"
          if [ ! -d "$sdk_root/ndk/$UR_ANDROID_NDK" ]; then
            echo "::error::the NDK is not at $sdk_root/ndk/$UR_ANDROID_NDK after sdkmanager --install"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$UR_ANDROID_NDK" >> "$GITHUB_ENV"

      # The Go the organization's release script builds the SDK with (build/all/run.sh
      # requires exactly 1.27.1), and the one upstream's own Android workflow used. The
      # upstream build_android recipe sets no GODEBUG, so go 1.27 can run the bind.
      # urnetwork-sdk/build/go.mod says `go 1.26.5`: that is a minimum, not the choice.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: urnetwork-sdk/build/go.sum

      # The sdk's go.mod replaces ../connect, ../connect/sctp, ../glog, ../goidenticons
      # and ../gvisor (build/go.mod the same, one level up), so the four directories sit
      # beside urnetwork-sdk under exactly these names.
      - name: Check out the sibling modules (pinned commits)
        run: |
          set -euo pipefail
          pin() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "https://github.com/urnetwork/$1.git" "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            if [ "$(git -C "$1" rev-parse HEAD)" != "$2" ]; then
              echo "::error::$1 is at $(git -C "$1" rev-parse HEAD), not at $2"
              exit 1
            fi
            echo "$1 $2"
          }
          pin connect "$CONNECT_SHA"
          pin glog "$GLOG_SHA"
          pin goidenticons "$GOIDENTICONS_SHA"
          pin gvisor "$GVISOR_SHA"
          test -f connect/sctp/go.mod
          echo "sdk $(git -C urnetwork-sdk rev-parse HEAD)"

      - name: Build SDK for Android
        working-directory: urnetwork-sdk/build
        env:
          BRINGYOUR_HOME: ${{ github.workspace }}/urnetwork-sdk
          WARP_HOME: ${{ github.workspace }}/urnetwork-sdk
          WARP_VERSION_HOME: ${{ github.workspace }}/urnetwork-sdk/version
          # setup-go installed 1.27.1. `local` turns a `go` line newer than that
          # anywhere in the module graph into a loud error instead of a silent switch
          # to another toolchain.
          GOTOOLCHAIN: local
        run: |
          export PATH="$PATH:/usr/local/go/bin:$HOME/go/bin"
          # build_android resolves llvm-objcopy under ANDROID_NDK_HOME and
          # `test -n`s it under `set -e`. Empty, that fails ~90s into the
          # recipe as an opaque `find: '': No such file or directory`. Say so
          # here instead.
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "::error::ANDROID_NDK_HOME is not a directory (got '$ANDROID_NDK_HOME') -- the NDK step did not export it"
            exit 1
          fi
          go version
          # init_tools, not init: it installs the pinned gomobile, gobind and checksec
          # and stops. This is the pair of targets upstream's own workflow ran.
          make init_tools
          make build_android
          aar_dir="$BRINGYOUR_HOME/build/android"
          if ! ls "$aar_dir"/*.aar >/dev/null 2>&1; then
            echo "::error::gomobile bind produced no .aar in $aar_dir -- see the go compile errors above"
            exit 1
          fi
          ls -la "$aar_dir"

      # The .aar the app links against. A Windows machine cannot easily run the gomobile
      # recipe: with these two files in <dir>/build/android and BRINGYOUR_HOME=<dir> (or
      # <dir> named urnetwork-sdk beside this repository) the app builds in Android Studio.
      - name: Upload the SDK .aar
        if: matrix.flavor == 'play'
        uses: actions/upload-artifact@v4
        with:
          name: urnetwork-sdk-android-aar
          path: |
            urnetwork-sdk/build/android/*.aar
            urnetwork-sdk/build/android/*-sources.jar
          if-no-files-found: error

      - name: Write local.properties to bypass warpctl
        working-directory: app
        run: |
          cat > local.properties <<EOF
          warp.version=${{ env.WARP_VERSION }}
          warp.version_code=${{ github.run_number }}
          WALLETCONNECT_PROJECT_ID=${{ env.WALLETCONNECT_PROJECT_ID }}
          EOF

      - name: Build ${{ matrix.flavor }}Debug APK
        working-directory: app
        env:
          BRINGYOUR_HOME: ${{ github.workspace }}/urnetwork-sdk
        run: |
          flavor="${{ matrix.flavor }}"
          # Gradle's generated task name only capitalizes the flavor's first
          # letter -- it does not camelCase underscore segments, so
          # ethos_dapp -> assembleEthos_dappDebug, not assembleEthosDappDebug.
          capitalizedFlavor=$(echo "$flavor" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew ":app:assemble${capitalizedFlavor}Debug"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: urnetwork-android-${{ matrix.flavor }}-apk
          path: app/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: error

      # A push and a manual run both publish: the owner installs from the release page
      # on the phone. The tag is this branch's own and points at the commit that was built.
      - name: Create prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: beta-talisman-${{ matrix.flavor }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "URnetwork Android Talisman live test (${{ matrix.flavor }}) ${{ github.run_number }}" \
            --notes "Live-test build ${{ env.WARP_VERSION }}. Install the arm64-v8a APK. android $GITHUB_SHA; sdk $SDK_REPOSITORY@$SDK_REF; connect $CONNECT_SHA; glog $GLOG_SHA; goidenticons $GOIDENTICONS_SHA; gvisor $GVISOR_SHA." \
            app/app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk

      - name: Attach the SDK .aar to the play prerelease
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.flavor == 'play'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: beta-talisman-${{ matrix.flavor }}-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            urnetwork-sdk/build/android/*.aar urnetwork-sdk/build/android/*-sources.jar
